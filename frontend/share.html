<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五棵松工作台</title><style>
:root{--bg:#0f1115;--card:#223226;--line:#3c503b;--text:#edf3e6;--muted:#b7c6b1;--accent:#d1f477}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1920px;margin:auto;padding:28px clamp(20px,3vw,64px) 34px}.hero{padding:30px 36px;border-radius:24px;background:linear-gradient(110deg,#dcfa8c,#bde568);color:#213425}.hero h1{font-size:clamp(26px,3vw,48px);margin:0;letter-spacing:-.04em}.hero p{font-size:clamp(19px,2.2vw,34px);font-weight:750;margin:12px 0 0;letter-spacing:-.035em}.hero em{font-style:normal;color:#152d18}.hero small{display:block;font-size:10px;letter-spacing:.16em;margin-bottom:10px}.status{color:var(--muted);font-size:12px;margin:14px 2px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{height:600px;min-width:0;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}.card-head{display:flex;justify-content:space-between;color:var(--accent);font-size:11px;letter-spacing:.08em}.card h2{font-size:30px;margin:25px 0 4px}.sub{font-size:12px;color:var(--muted);margin-bottom:16px}.windows{overflow:auto;flex:1}.window{padding:16px 0;border-top:1px solid var(--line)}.window:first-child{border-top:0}.window-name{font-size:15px;font-weight:650}.donut{position:relative;width:146px;height:146px;margin:14px auto}.donut svg{width:100%;height:100%;transform:rotate(-90deg)}circle{fill:none;stroke-width:9}.track{stroke:var(--line)}.value{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:var(--pct) 100}.donut strong{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent)}.window-info{text-align:center;color:var(--muted);font-size:12px;line-height:1.7}.window-info b{display:block;color:var(--text);font-size:19px}.card-foot{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:11px}.empty{color:var(--muted);padding-top:30px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{height:560px}}@media(max-width:600px){main{padding:16px}.hero{padding:24px 20px}.hero p{font-size:22px}.grid{grid-template-columns:1fr}.card{height:520px}}
</style></head><body><main><header class="hero"><small>LAN VIEW / READ ONLY</small><h1>五棵松工作台</h1><p>让每一份 AI 能量，<em>都用在创造上。</em></p></header><div class="status" id="status">正在读取卡片…</div><section class="grid" id="cards"></section><div class="status">只读展示本机已有缓存。刷新和账号设置请回到本机工作台。</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={Codex:'本机登录',Kimi:'本机登录','百炼 · 个人账号':'个人账号','智谱 Code Plan':'Code Plan'};
function card(c){const windows=c.windows||[];return `<article class="card"><div class="card-head"><span>AI QUOTA</span><span>${c.stale?'缓存待更新':'只读快照'}</span></div><h2>${esc(c.name)}</h2><div class="sub">${esc(labels[c.name]||'额度概览')}</div><div class="windows">${windows.length?windows.map(w=>{const remain=typeof w.used==='number'?Math.max(0,Math.min(100,100-w.used)):null;return `<div class="window"><div class="window-name">${esc(w.name)}</div>${remain==null?'<p class="empty">暂无额度快照</p>':`<div class="donut" style="--pct:${remain}"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="51"/><circle class="value" pathLength="100" cx="60" cy="60" r="51"/></svg><strong>${Number(remain.toFixed(2))}%</strong></div><div class="window-info">剩余额度<b>已用 ${Number(w.used.toFixed(2))}%</b></div>`}</div>`}).join(''):'<p class="empty">暂无缓存，请由本机刷新。</p>'}</div><div class="card-foot">${c.updated_at?'数据更新：'+esc(new Date(c.updated_at*1000).toLocaleString('zh-CN')):'尚未获取官方配额'}</div></article>`}async function refresh(){try{const r=await fetch('/api/share/public');if(!r.ok)throw Error();const d=await r.json();document.getElementById('cards').innerHTML=d.cards.map(card).join('');document.getElementById('status').textContent='已读取本机缓存 · '+new Date().toLocaleTimeString('zh-CN')}catch(e){document.getElementById('status').textContent='暂时连接不上工作台，请确认电脑已启动且设备在同一局域网。'}}refresh();setInterval(()=>{if(!document.hidden)refresh()},60000);
</script></body></html>
